<div class="save-toast" id="saveStatus">
    <span class="save-message"></span>
</div>

<div id="confirmModal" class="modal-backdrop">
    <div class="modal-dialog">
        <h3 id="confirmTitle" class="modal-title">Confirm Action</h3>
        <p id="confirmMessage" class="modal-body">Are you sure you want to proceed?</p>
        <div class="modal-actions">
            <button id="confirmCancel" class="btn btn-outline">Cancel</button>
            <button id="confirmOk" class="btn btn-primary">Confirm</button>
        </div>
    </div>
</div>

<div id="importModal" class="modal-backdrop">
    <div class="modal-dialog">
        <h3 id="importModalTitle" class="modal-title">Import Data</h3>
        <p id="importModalMessage" class="modal-body">Should the imported data be appended to the currently-existing data or replace it?</p>
        <div class="modal-actions">
            <button id="importAppendBtn" class="btn btn-primary">Append Data</button>
            <button id="importReplaceBtn" class="btn btn-danger">Replace Data</button>
            <button id="importCancelBtn" class="btn btn-outline">Cancel</button>
        </div>
    </div>
</div>

<div id="toast-notification" class="toast"></div>
